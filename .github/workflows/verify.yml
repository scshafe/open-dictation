name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift run OpenDictationSelfTest
      - run: swift test
      - run: python3 scripts/verify-library-consumer.py
      - run: CODESIGN_IDENTITY=- ./scripts/package-app.sh release
